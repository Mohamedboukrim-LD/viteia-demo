openapi: 3.1.0
info:
  title: VITEIA TaaS API
  version: 0.2.0
  summary: Unified API for discovering, booking and running experiments on federated Virtual Worlds testbeds.
  description: |
    Draft specification prepared by Lasting Dynamics as the seed of task T3.3
    (VW TaaS APIs and interoperability requirements, deliverable D3.3).

    The API is organised by resource category. Tranche 1 specified `testbeds`,
    tranche 2 (this version) specifies `bookings`. The other categories are
    declared as tags and will be specified in the next tranches, in this order:
    experiments, telemetry, results, assets, identity.

    All data in the examples is fictional demo data for the kick-off video.
    It does not describe any real partner facility.
  contact:
    name: Lasting Dynamics SL
servers:
  - url: http://localhost:4010
    description: Local mock server (Prism). Prism matches raw paths, so the version prefix is omitted here.
  - url: https://api.viteia.example/v1
    description: Placeholder for the future gateway

tags:
  - name: testbeds
    description: Catalogue of federated testbeds, their location, status and capabilities.
  - name: bookings
    description: |
      Reservation of testbed resources for a time window, with the QoS the user
      needs. A booking is the precondition of an experiment: the experiment
      (tranche 3) runs inside a confirmed booking.
  - name: experiments
    description: Creation, start, stimulation and stop of experiments, including multi-testbed workflows. (Tranche 3)
  - name: telemetry
    description: Real-time data streams from running experiments. (Tranche 4)
  - name: results
    description: Reports and metrics of completed experiments. (Tranche 4)
  - name: assets
    description: Upload, versioning and access control of 3D assets in glTF 2.0. (Tranche 5)
  - name: identity
    description: Authentication and authorisation, aligned with the security framework of T2.4. (Tranche 6)

paths:
  /testbeds:
    get:
      tags: [testbeds]
      operationId: listTestbeds
      summary: List the testbeds of the federation
      description: |
        Returns the catalogue. Filters are combined with AND. The mock server
        ignores filters and always returns the full catalogue; the demo client
        filters on its side.
      parameters:
        - name: domain
          in: query
          description: Keep only testbeds offering at least one of these domains.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Domain'
          style: form
          explode: false
        - name: country
          in: query
          description: ISO 3166-1 alpha-2 country code.
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: BG
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TestbedStatus'
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestbedList'
              examples:
                catalogue:
                  $ref: '#/components/examples/Catalogue'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /testbeds/{testbedId}:
    get:
      tags: [testbeds]
      operationId: getTestbed
      summary: Get one testbed
      description: Full record of a testbed, including its latest conformance result.
      parameters:
        - $ref: '#/components/parameters/TestbedId'
      responses:
        '200':
          description: The testbed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Testbed'
              examples:
                sofiaRobotics:
                  $ref: '#/components/examples/SofiaRobotics'
        '404':
          $ref: '#/components/responses/NotFound'

  /testbeds/{testbedId}/capabilities:
    get:
      tags: [testbeds]
      operationId: listTestbedCapabilities
      summary: List the capabilities of a testbed
      description: |
        Detailed, machine-readable capabilities: hardware, engines and the QoS
        the testbed can guarantee. A booking request (tranche 2) is validated
        against this list.
      parameters:
        - $ref: '#/components/parameters/TestbedId'
      responses:
        '200':
          description: The capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityList'
              examples:
                sofiaRobotics:
                  value:
                    testbedId: tb-sofia-robotics
                    items:
                      - id: cap-quadruped-01
                        kind: robot
                        name: Quadruped inspection robot
                        quantity: 2
                        engines: []
                        qos:
                          maxLatencyMs: 30
                          minFrameRate: null
                      - id: cap-dt-engine
                        kind: digital_twin_platform
                        name: Site digital twin runtime
                        quantity: 1
                        engines: [unity]
                        qos:
                          maxLatencyMs: 50
                          minFrameRate: 60
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings:
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Book resources on one or more testbeds
      description: |
        The federation checks each requested capability against the testbed's
        catalogue (quantity available, QoS guaranteed) and answers with the
        booking and its status. A multi-testbed booking is confirmed only if
        every testbed can satisfy its part; otherwise it is rejected with the
        violations listed, so the client can propose an alternative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            examples:
              highwayTwin:
                $ref: '#/components/examples/BookingRequestHighwayTwin'
      responses:
        '201':
          description: The booking was created. Check `status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                confirmed:
                  $ref: '#/components/examples/BookingConfirmed'
        '422':
          description: The request cannot be satisfied as written.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BookingProblem'
              example:
                type: https://api.viteia.example/problems/qos-not-satisfiable
                title: Requested QoS cannot be guaranteed
                status: 422
                violations:
                  - testbedId: tb-lisbon-iot
                    capabilityId: cap-lidar-array
                    field: maxLatencyMs
                    requested: 20
                    available: 80
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bookings/{bookingId}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: Get one booking
      description: Current status of a booking and the QoS each testbed guaranteed.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: The booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                confirmed:
                  $ref: '#/components/examples/BookingConfirmed'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [bookings]
      operationId: cancelBooking
      summary: Cancel a booking
      description: Allowed until the booking window starts. Running experiments are not affected by a cancellation request; they must be stopped first (tranche 3).
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '204':
          description: Cancelled.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The booking window has already started.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.viteia.example/problems/booking-started
                title: Booking already started
                status: 409

components:
  parameters:
    TestbedId:
      name: testbedId
      in: path
      required: true
      schema:
        type: string
        pattern: '^tb-[a-z0-9-]+$'
        example: tb-sofia-robotics
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        pattern: '^bk-[a-z0-9-]+$'
        example: bk-2027-0142

  responses:
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.viteia.example/problems/not-found
            title: Testbed not found
            status: 404
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.viteia.example/problems/unauthorized
            title: Authentication required
            status: 401

  schemas:
    Domain:
      type: string
      description: Family of capabilities a testbed offers.
      enum: [digital_twin, xr, robotics, 5g, hpc, iot, simulation]

    TestbedStatus:
      type: string
      enum: [online, maintenance, offline]

    Engine:
      type: string
      description: Virtual World engines supported. `custom` covers proprietary engines described in the capability name.
      enum: [unity, unreal, godot, custom]

    Location:
      type: object
      required: [city, country, lat, lon]
      properties:
        city:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2.
          minLength: 2
          maxLength: 2
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180

    QoSProfile:
      type: object
      description: Guarantees the testbed can offer. `null` means not applicable.
      properties:
        maxLatencyMs:
          type: [integer, 'null']
          minimum: 0
          description: Upper bound of end-to-end latency the testbed guarantees.
        minFrameRate:
          type: [integer, 'null']
          minimum: 0
          description: Minimum frame rate guaranteed for immersive applications.

    Testbed:
      type: object
      required: [id, name, operator, location, domains, status, engines, qos]
      properties:
        id:
          type: string
          pattern: '^tb-[a-z0-9-]+$'
        name:
          type: string
        operator:
          type: string
          description: Organisation operating the testbed.
        description:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        domains:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Domain'
        status:
          $ref: '#/components/schemas/TestbedStatus'
        engines:
          type: array
          items:
            $ref: '#/components/schemas/Engine'
        qos:
          $ref: '#/components/schemas/QoSProfile'
        conformance:
          type: object
          description: Result of the latest VITEIA conformance test suite run.
          properties:
            passed:
              type: integer
            total:
              type: integer
            runAt:
              type: string
              format: date-time

    TestbedList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Testbed'
        total:
          type: integer

    Capability:
      type: object
      required: [id, kind, name, quantity]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [xr_headset, robot, network_5g, digital_twin_platform, hpc_node, sensor_array, simulator]
        name:
          type: string
        quantity:
          type: integer
          minimum: 0
          description: Units available for booking.
        engines:
          type: array
          items:
            $ref: '#/components/schemas/Engine'
        qos:
          $ref: '#/components/schemas/QoSProfile'

    CapabilityList:
      type: object
      required: [testbedId, items]
      properties:
        testbedId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Capability'

    TimeWindow:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    QoSRequirement:
      type: object
      description: What the user needs. Compared with the testbed's QoSProfile.
      properties:
        maxLatencyMs:
          type: integer
          minimum: 0
        minFrameRate:
          type: integer
          minimum: 0

    ResourceRequest:
      type: object
      required: [testbedId, capabilityId, quantity]
      properties:
        testbedId:
          type: string
        capabilityId:
          type: string
          description: From `GET /testbeds/{testbedId}/capabilities`.
        quantity:
          type: integer
          minimum: 1

    ResourceAllocation:
      allOf:
        - $ref: '#/components/schemas/ResourceRequest'
        - type: object
          required: [guaranteedQos]
          properties:
            guaranteedQos:
              $ref: '#/components/schemas/QoSProfile'

    BookingRequest:
      type: object
      required: [window, resources]
      properties:
        purpose:
          type: string
          description: Free text, as the user wrote it. Kept for the report.
          maxLength: 500
        window:
          $ref: '#/components/schemas/TimeWindow'
        resources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ResourceRequest'
        qos:
          $ref: '#/components/schemas/QoSRequirement'

    BookingStatus:
      type: string
      enum: [pending, confirmed, rejected, cancelled]

    Booking:
      type: object
      required: [id, status, window, resources, createdAt]
      properties:
        id:
          type: string
          pattern: '^bk-[a-z0-9-]+$'
        status:
          $ref: '#/components/schemas/BookingStatus'
        purpose:
          type: string
        window:
          $ref: '#/components/schemas/TimeWindow'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceAllocation'
        qos:
          $ref: '#/components/schemas/QoSRequirement'
        testbedIds:
          type: array
          description: Convenience list of the testbeds involved.
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    QoSViolation:
      type: object
      required: [testbedId, field, requested, available]
      properties:
        testbedId:
          type: string
        capabilityId:
          type: string
        field:
          type: string
          enum: [maxLatencyMs, minFrameRate, quantity]
        requested:
          type: number
        available:
          type: [number, 'null']

    BookingProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            violations:
              type: array
              items:
                $ref: '#/components/schemas/QoSViolation'

    Problem:
      type: object
      description: Error body, RFC 9457.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Defined in the identity tranche. Not enforced by the mock.

  examples:
    SofiaRobotics:
      value:
        id: tb-sofia-robotics
        name: Sofia Robotics Lab
        operator: Demo operator A
        description: Legged and wheeled robots with an indoor construction mock-up and a site digital twin runtime.
        location: { city: Sofia, country: BG, lat: 42.6977, lon: 23.3219 }
        domains: [robotics, digital_twin, iot]
        status: online
        engines: [unity]
        qos: { maxLatencyMs: 30, minFrameRate: 60 }
        conformance: { passed: 112, total: 112, runAt: '2027-01-10T09:00:00Z' }
    BookingRequestHighwayTwin:
      summary: Two testbeds for a highway-construction digital twin test
      value:
        purpose: Test a digital twin of a highway construction site with a robot inspecting a tunnel
        window: { start: '2027-02-03T09:00:00Z', end: '2027-02-03T11:00:00Z' }
        resources:
          - { testbedId: tb-sofia-robotics, capabilityId: cap-quadruped-01, quantity: 1 }
          - { testbedId: tb-sofia-robotics, capabilityId: cap-dt-engine, quantity: 1 }
          - { testbedId: tb-oulu-5g-xr, capabilityId: cap-5g-slice, quantity: 1 }
          - { testbedId: tb-oulu-5g-xr, capabilityId: cap-xr-headset, quantity: 2 }
        qos: { maxLatencyMs: 20, minFrameRate: 90 }
    BookingConfirmed:
      value:
        id: bk-2027-0142
        status: confirmed
        purpose: Test a digital twin of a highway construction site with a robot inspecting a tunnel
        window: { start: '2027-02-03T09:00:00Z', end: '2027-02-03T11:00:00Z' }
        resources:
          - { testbedId: tb-sofia-robotics, capabilityId: cap-quadruped-01, quantity: 1, guaranteedQos: { maxLatencyMs: 18, minFrameRate: null } }
          - { testbedId: tb-sofia-robotics, capabilityId: cap-dt-engine, quantity: 1, guaranteedQos: { maxLatencyMs: 20, minFrameRate: 90 } }
          - { testbedId: tb-oulu-5g-xr, capabilityId: cap-5g-slice, quantity: 1, guaranteedQos: { maxLatencyMs: 12, minFrameRate: null } }
          - { testbedId: tb-oulu-5g-xr, capabilityId: cap-xr-headset, quantity: 2, guaranteedQos: { maxLatencyMs: 20, minFrameRate: 90 } }
        qos: { maxLatencyMs: 20, minFrameRate: 90 }
        testbedIds: [tb-sofia-robotics, tb-oulu-5g-xr]
        createdAt: '2027-01-20T10:15:00Z'
    Catalogue:
      value:
        total: 10
        items:
          - id: tb-sofia-robotics
            name: Sofia Robotics Lab
            operator: Demo operator A
            description: Legged and wheeled robots with an indoor construction mock-up and a site digital twin runtime.
            location: { city: Sofia, country: BG, lat: 42.6977, lon: 23.3219 }
            domains: [robotics, digital_twin, iot]
            status: online
            engines: [unity]
            qos: { maxLatencyMs: 30, minFrameRate: 60 }
            conformance: { passed: 112, total: 112, runAt: '2027-01-10T09:00:00Z' }
          - id: tb-oulu-5g-xr
            name: Oulu 5G/XR Lab
            operator: Demo operator B
            description: Private 5G network with edge rendering and a fleet of OpenXR headsets.
            location: { city: Oulu, country: FI, lat: 65.0121, lon: 25.4651 }
            domains: [5g, xr]
            status: online
            engines: [unity, unreal]
            qos: { maxLatencyMs: 20, minFrameRate: 90 }
            conformance: { passed: 112, total: 112, runAt: '2027-01-08T14:30:00Z' }
          - id: tb-athens-xr
            name: Athens Immersive Lab
            operator: Demo operator C
            description: Multi-user VR and AR space with motion capture.
            location: { city: Athens, country: GR, lat: 37.9838, lon: 23.7275 }
            domains: [xr, simulation]
            status: online
            engines: [unity, godot]
            qos: { maxLatencyMs: 25, minFrameRate: 90 }
            conformance: { passed: 110, total: 112, runAt: '2027-01-05T10:00:00Z' }
          - id: tb-stuttgart-vr
