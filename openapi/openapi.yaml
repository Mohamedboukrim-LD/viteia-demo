            location: { city: Stuttgart, country: DE, lat: 48.7758, lon: 9.1829 }
            domains: [xr, digital_twin]
            status: online
            engines: [unreal, custom]
            qos: { maxLatencyMs: 20, minFrameRate: 120 }
            conformance: { passed: 112, total: 112, runAt: '2027-01-12T08:15:00Z' }
          - id: tb-limerick-hpc
            name: Limerick HPC Node
            operator: Demo operator E
            description: GPU cluster for simulation and model training.
            location: { city: Limerick, country: IE, lat: 52.6638, lon: -8.6267 }
            domains: [hpc, simulation]
            status: online
            engines: []
            qos: { maxLatencyMs: null, minFrameRate: null }
            conformance: { passed: 112, total: 112, runAt: '2027-01-03T16:00:00Z' }
          - id: tb-lisbon-iot
            name: Lisbon IoT Field Lab
            operator: Demo operator F
            description: Outdoor sensor network with LiDAR and environmental sensors.
            location: { city: Lisbon, country: PT, lat: 38.7223, lon: -9.1393 }
